plugins {
    id 'java-gradle-plugin'
    id 'eclipse'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'com.cinchapi'
version = '2.0.0'

repositories {
    mavenCentral()
}

sourceSets {
    functionalTest
}

configurations {
    functionalTestImplementation.extendsFrom testImplementation
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// The plugin runs inside the build that applies it, and Gradle 8 runs on Java
// 8, so the plugin's classes target Java 8. The tests run only here, on the
// daemon's JDK.
tasks.named('compileJava') {
    options.release = 8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def functionalTest = tasks.register('functionalTest', Test) {
    description = 'Runs the functional tests, which build sample projects ' +
        'with the plugin and run their binaries.'
    group = 'verification'
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
}

tasks.named('check') {
    dependsOn functionalTest
}

gradlePlugin {
    website = 'https://github.com/cinchapi/jarsh'
    vcsUrl = 'https://github.com/cinchapi/jarsh'
    plugins {
        jarsh {
            id = 'com.cinchapi.jarsh'
            implementationClass = 'com.cinchapi.jarsh.JarshPlugin'
            displayName = 'Jarsh'
            description = 'Builds a Java application into one executable ' +
                'shell script that carries the application and all of its ' +
                'dependencies.'
            tags = ['java', 'fatjar', 'executable jar', 'shell script',
                    'binary']
        }
    }
    testSourceSets sourceSets.functionalTest
}
